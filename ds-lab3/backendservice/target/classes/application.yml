spring:
  application:
    name: backendservice

management:
  endpoint:
    chaosmonkey:
      enabled: true
    chaosmonkeyjmx:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - chaosmonkey

chaos:
  monkey:
    enabled: true
    watcher:
      controller: true
      service: true
    assaults:
      latency-active: true
      latency-range-start: 1000
      latency-range-end: 3000
      exceptions-active: false
      kill-application-active: false
