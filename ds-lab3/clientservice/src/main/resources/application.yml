# Reference : https://resilience4j.readme.io/docs/examples
# Reference: https://docs.spring.io/spring-cloud-circuitbreaker/docs/current/reference/html/spring-cloud-circuitbreaker-resilience4j.html
spring:
  application:
    name: clientservice

backend:
  url: http://backendservice:8080/api/message

resilience4j:
  circuitbreaker:
    instances:
      backendService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

  retry:
    instances:
      backendRetry:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        enable-randomized-wait: true           
        randomized-wait-factor: 0.5
logging:
  level:
    root: INFO
    io.github.resilience4j.circuitbreaker: INFO
    io.github.resilience4j.retry: INFO
    com.example.client.service.BackendClient: INFO
